name: Sentinel Cycle

on:
  workflow_dispatch: # Оставляем только ручной запуск кнопки
  # push:             <-- Закомментировали
  #   branches: [ "main" ]
  # schedule:         <-- Закомментировали (ГЛАВНОЕ)
  #   - cron: '*/15 * * * *'

concurrency:
  group: sentinel-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run sentinel cycle
        run: python main.py

      - name: Upload history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-history
          path: docs/memory-bank/history.csv
          if-no-files-found: ignore
